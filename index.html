<style>
/* Layout: full-bleed 3D stage; slim top bar; one contextual glass panel (right on desktop, bottom sheet on phones); view switch bottom-centre. */
:root {
  --night: #0f1828;        /* stage + panels */
  --ink: #1b2a41;          /* raised surfaces */
  --amber: #f2b84b;        /* selection + lit windows */
  --stone: #ede6da;        /* primary text */
  --mist: #9fb0c3;         /* secondary text */
  --line: rgba(237, 230, 218, 0.14);
  --glass: rgba(15, 24, 40, 0.78);
  --ok: #8fcf9a; --held: #f2b84b; --sold: #8b95a3;
  --f-display: "Lora", Georgia, "Times New Roman", serif;
  --f-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--stone); font-family: var(--f-ui); font-size: 14px; overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* top bar */
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to bottom, rgba(15,24,40,.86), rgba(15,24,40,0)); pointer-events: none; }
.topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-logo { height: 22px; width: auto; flex: none; }
.brand-txt { display: flex; flex-direction: column; min-width: 0; }
.brand-txt b { font-family: var(--f-display); font-weight: 600; font-size: 18px; letter-spacing: .2px; white-space: nowrap; }
.brand-txt span { color: var(--mist); font-size: 11.5px; letter-spacing: .6px; text-transform: uppercase; white-space: nowrap; }
.crumbs { flex: 1; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.crumbs button { background: none; border: 0; padding: 4px 6px; color: var(--mist); border-radius: 6px; font-size: 13px; }
.crumbs button[aria-current="true"] { color: var(--stone); font-weight: 600; }
.crumbs i { color: var(--line); font-style: normal; align-self: center; }
.tools { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: rgba(27,42,65,.85); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { background: none; border: 0; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; color: var(--mist); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--stone); color: var(--night); font-weight: 600; }
.seg button:disabled { opacity: .35; cursor: default; }
.iconbtn { width: 34px; height: 34px; border-radius: 999px; background: rgba(27,42,65,.85); border: 1px solid var(--line); display: grid; place-items: center; }
.iconbtn svg { width: 16px; height: 16px; }

/* back */
#back { position: fixed; z-index: 19; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(64px + env(safe-area-inset-top, 0px));
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px 9px 10px; border-radius: 999px;
  background: var(--stone); color: var(--night); border: 0; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
#back svg { width: 16px; height: 16px; }

/* panel */
#panel { position: fixed; z-index: 18; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(64px + env(safe-area-inset-top, 0px));
  bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: 340px; overflow: auto; background: var(--glass); backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
#panel h2 { font-family: var(--f-display); font-weight: 600; font-size: 24px; margin: 0; text-wrap: balance; }
#panel h3 { font-size: 11.5px; letter-spacing: .8px; text-transform: uppercase; color: var(--mist); margin: 4px 0 0; font-weight: 600; }
#panel p { margin: 0; color: var(--mist); line-height: 1.5; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fact { background: rgba(27,42,65,.7); border-radius: 10px; padding: 10px; }
.fact b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.fact span { color: var(--mist); font-size: 11.5px; }
.list { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: rgba(27,42,65,.55);
  border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; }
.row:hover, .row.hot { border-color: var(--amber); background: rgba(242,184,75,.10); }
.row .id { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 64px; }
.row .meta { color: var(--mist); font-size: 12.5px; flex: 1; min-width: 0; }
.row .num { font-variant-numeric: tabular-nums; color: var(--stone); font-size: 12.5px; }
.dot { width: 8px; height: 8px; border-radius: 99px; flex: none; }
.dot.ok { background: var(--ok); } .dot.held { background: var(--held); } .dot.sold { background: var(--sold); }
.floors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.floors button { background: rgba(27,42,65,.55); border: 1px solid transparent; border-radius: 8px; padding: 9px 0; font-variant-numeric: tabular-nums; font-weight: 600; }
.floors button small { display: block; font-weight: 400; color: var(--mist); font-size: 10.5px; }
.floors button:hover, .floors button.hot { border-color: var(--amber); }
.floors button.wide { grid-column: span 2; }
.cta { background: var(--amber); color: var(--night); border: 0; border-radius: 12px; padding: 12px; font-weight: 600; }
.cta.ghost { background: none; color: var(--stone); border: 1px solid var(--line); }
.cta-row { display: flex; gap: 8px; } .cta-row .cta { flex: 1; }
.note { font-size: 11.5px; color: var(--mist); border-top: 1px solid var(--line); padding-top: 10px; line-height: 1.5; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--mist); font-size: 12px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.towers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tower-card { background: rgba(27,42,65,.6); border: 1px solid transparent; border-radius: 12px; padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.tower-card:hover, .tower-card.hot { border-color: var(--amber); }
.tower-card b { font-family: var(--f-display); font-size: 20px; }
.tower-card span { color: var(--mist); font-size: 12px; }

/* bottom */
#views { position: fixed; z-index: 18; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
#views .seg { box-shadow: 0 8px 24px rgba(0,0,0,.3); }
#views .seg button { padding: 9px 16px; font-size: 13px; }
.disclaimer { position: fixed; z-index: 17; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  font-size: 11px; color: var(--mist); max-width: 280px; line-height: 1.4; opacity: .85; }

/* overlays */
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 15; }
.lbl { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; text-align: center; font-size: 11.5px; color: var(--stone);
  text-shadow: 0 1px 3px rgba(0,0,0,.7); }
.lbl small { display: block; color: #d7cdb9; font-size: 10.5px; }
.lbl.tower { font-family: var(--f-display); font-size: 22px; font-weight: 600; background: rgba(15,24,40,.7); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 14px; text-shadow: none; }
#tip { position: fixed; z-index: 30; pointer-events: none; background: var(--stone); color: var(--night); border-radius: 10px; padding: 8px 11px;
  font-size: 12.5px; line-height: 1.35; box-shadow: 0 8px 24px rgba(0,0,0,.3); transform: translate(14px, 14px); }
#tip b { font-size: 14px; }
#loader { position: fixed; inset: 0; z-index: 50; background: var(--night); display: grid; place-items: center; transition: opacity .6s; }
#loader .box { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px; text-align: center; }
#loader .brand-logo { height: 40px; }
#loader h1 { font-family: var(--f-display); font-weight: 600; font-size: 28px; margin: 0; }
#loader .bar { width: 220px; height: 3px; background: var(--ink); border-radius: 3px; overflow: hidden; }
#loader .bar i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .2s; }
#loader p { color: var(--mist); margin: 0; font-size: 12.5px; }
#toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); top: calc(70px + env(safe-area-inset-top, 0px));
  background: var(--stone); color: var(--night); padding: 10px 14px; border-radius: 10px; font-size: 13px; max-width: min(520px, 90vw); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
#walkhelp { position: fixed; z-index: 18; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 12.5px; color: var(--mist); white-space: nowrap; }
#cross { position: fixed; z-index: 16; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 99px; background: rgba(237,230,218,.6); pointer-events: none; }

@media (max-width: 760px) {
  .brand-txt, .crumbs { display: none; }
  #panel { top: auto; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); width: auto;

  #panel h2 { font-size: 20px; }
  .disclaimer { display: none; }
  #views .seg button { padding: 8px 10px; font-size: 12px; }
  #walkhelp { display: none; }
  .tools .seg button { padding: 6px 9px; }
}
@media (prefers-reduced-motion: reduce) { #loader { transition: none; } }

.sheet-eyebrow { margin: 0 0 4px; color: var(--amber); font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; }

.sheet form { display: flex; flex-direction: column; gap: 10px; }
.sheet label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--mist); }
.sheet input, .sheet textarea { font: inherit; font-size: 15px; color: var(--stone); background: rgba(27,42,65,.7); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; color-scheme: dark; }
.sheet input:focus, .sheet textarea:focus { outline: 2px solid var(--amber); outline-offset: 0; }

#fallback { position: fixed; inset: 0; z-index: 45; overflow: auto; background: var(--night); }
.fb-hero { position: relative; min-height: 58vh; display: flex; align-items: flex-end; background: linear-gradient(0deg, var(--night) 0%, rgba(15,24,40,0) 45%), var(--fbimg, none) center/cover no-repeat; padding: 90px max(16px, 5vw) 24px; }

<div id="walkhelp" hidden>Drag to look · W A S D or arrows to move · click the floor to walk there</div>
<div id="cross" hidden></div>
<div id="walkpad" hidden><button id="wp-fwd" aria-label="Forward">▲</button><button id="wp-back" aria-label="Backward">▼</button></div>

<!-- inquiry: posts to the BINO site's existing /api/inquiries flow -->
<div id="inq" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="inq-title">
  <div class="sheet-card">
    <button class="sheet-x" id="inq-x" aria-label="Close">×</button>
    <p class="sheet-eyebrow" id="inq-apt"></p>
    <h2 id="inq-title"></h2>
    <form id="inq-form" novalidate>
      <label><span id="l-name"></span><input name="name" required maxlength="100" autocomplete="name"></label>
      <label><span id="l-phone"></span><input name="phone" type="tel" required maxlength="40" autocomplete="tel" placeholder="+992"></label>
      <label><span id="l-email"></span><input name="email" type="email" maxlength="254" autocomplete="email"></label>
      <label><span id="l-visit"></span><input name="appointment" type="datetime-local"></label>
      <label><span id="l-msg"></span><textarea name="message" maxlength="2000" rows="3"></textarea></label>
      <p class="sheet-note" id="inq-privacy"></p>
      <p class="sheet-err" id="inq-err" hidden></p>
      <button class="cta" type="submit" id="inq-send"></button>
    </form>
    <div id="inq-done" hidden><h3 id="inq-ok"></h3><p id="inq-okp"></p></div>
  </div>
</div>

<!-- optional promotional film (Kling); navigation itself is always real 3D -->
<div id="promo" class="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-card film"><button class="sheet-x" id="promo-x" aria-label="Close">×</button><video id="promo-v" controls playsinline preload="none"></video></div>
</div>

<!-- static fallback when WebGL is not available (or ?static=1) -->
<section id="fallback" hidden></section>
